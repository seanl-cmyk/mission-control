<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control — Sensei</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #1a1f26;
      --bg-tertiary: #242b33;
      --accent: #00d4aa;
      --accent-dim: #00a888;
      --text-primary: #e7e9ea;
      --text-secondary: #8b98a5;
      --border: #2f3943;
      --danger: #f4212e;
      --warning: #ffd400;
      --success: #00ba7c;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon { font-size: 32px; }
    
    h1 {
      font-size: 24px;
      font-weight: 600;
    }
    
    h1 span { color: var(--accent); }
    
    /* Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    
    .summary-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    
    .summary-card.highlight {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(0,212,170,0.1), transparent);
    }
    
    .summary-value {
      font-size: 36px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    
    .summary-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .summary-breakdown {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 12px;
      font-size: 12px;
    }
    
    .breakdown-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .breakdown-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .breakdown-dot.analysis { background: #00d4aa; }
    .breakdown-dot.response { background: #ffd400; }
    .breakdown-dot.notes { background: #8b98a5; }
    
    /* Day Sections */
    .day-section {
      margin-bottom: 32px;
    }
    
    .day-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    
    .day-date {
      font-size: 18px;
      font-weight: 600;
    }
    
    .day-stats {
      display: flex;
      gap: 12px;
      margin-left: auto;
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .day-stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .day-stat-value {
      color: var(--accent);
      font-weight: 600;
    }
    
    /* Ticket Cards */
    .tickets-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .ticket-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: start;
      transition: border-color 0.2s;
    }
    
    .ticket-card:hover {
      border-color: var(--accent);
    }
    
    .ticket-card.sensei-assisted {
      border-left: 3px solid var(--accent);
    }
    
    .ticket-id-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 100px;
    }
    
    .ticket-id {
      font-family: monospace;
      font-size: 14px;
      color: var(--accent);
      background: var(--bg-tertiary);
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    
    .ticket-id a {
      color: inherit;
      text-decoration: none;
    }
    
    .ticket-id a:hover {
      text-decoration: underline;
    }
    
    .ticket-status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      font-weight: 500;
      display: inline-block;
    }
    
    .status-open { background: var(--warning); color: #000; }
    .status-pending { background: #6366f1; color: #fff; }
    .status-hold { background: #f97316; color: #fff; }
    .status-resolved { background: var(--success); color: #fff; }
    
    .ticket-content {
      min-width: 0;
    }
    
    .ticket-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    
    .ticket-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .ticket-customer {
      color: var(--text-primary);
      font-weight: 500;
    }
    
    .ticket-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    
    .ticket-tag {
      font-size: 10px;
      padding: 2px 6px;
      background: var(--bg-tertiary);
      border-radius: 4px;
      color: var(--text-secondary);
    }
    
    .ticket-tag.category-voice { background: #1e3a5f; color: #60a5fa; }
    .ticket-tag.category-messaging { background: #1e3a3f; color: #34d399; }
    .ticket-tag.category-billing { background: #3f3a1e; color: #fbbf24; }
    .ticket-tag.category-wireless { background: #3a1e3f; color: #a78bfa; }
    
    .ticket-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }
    
    .sensei-badges {
      display: flex;
      gap: 6px;
    }
    
    .sensei-badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      background: var(--bg-tertiary);
      border: 2px solid var(--border);
      cursor: help;
    }
    
    .sensei-badge.active {
      border-color: var(--accent);
      background: rgba(0,212,170,0.2);
    }
    
    .sensei-badge.analysis.active { background: rgba(0,212,170,0.2); }
    .sensei-badge.response.active { background: rgba(255,212,0,0.2); border-color: var(--warning); }
    .sensei-badge.notes.active { background: rgba(139,152,165,0.2); border-color: var(--text-secondary); }
    
    /* Sensei Work Details */
    .sensei-details {
      grid-column: 1 / -1;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: none;
    }
    
    .ticket-card.expanded .sensei-details {
      display: block;
    }
    
    .sensei-section {
      margin-bottom: 12px;
    }
    
    .sensei-section:last-child {
      margin-bottom: 0;
    }
    
    .sensei-section-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .sensei-section-content {
      font-size: 13px;
      line-height: 1.5;
      background: var(--bg-tertiary);
      padding: 10px 12px;
      border-radius: 6px;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .expand-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .expand-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    /* Sync Status */
    .sync-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 13px;
    }
    
    .sync-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }
    
    .sync-indicator.syncing {
      background: var(--warning);
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .sync-text {
      color: var(--text-secondary);
    }
    
    .sync-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    
    .btn-secondary:hover {
      border-color: var(--accent);
    }
    
    .btn-primary {
      background: var(--accent);
      color: var(--bg-primary);
    }
    
    .btn-primary:hover {
      background: var(--accent-dim);
    }
    
    /* Empty state */
    .empty-day {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
    
    /* Legend */
    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .legend-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      background: var(--bg-tertiary);
      border: 2px solid var(--accent);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .ticket-card {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      
      .ticket-id-col {
        flex-direction: row;
        align-items: center;
      }
      
      .ticket-actions {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="logo-icon">🎯</span>
        <h1>Mission <span>Control</span></h1>
      </div>
    </header>
    
    <!-- Summary Cards -->
    <div class="summary-grid">
      <div class="summary-card highlight">
        <div class="summary-value" id="totalAssisted">0</div>
        <div class="summary-label">Sensei Assisted</div>
        <div class="summary-breakdown">
          <div class="breakdown-item">
            <span class="breakdown-dot analysis"></span>
            <span id="analysisCount">0</span> analysis
          </div>
          <div class="breakdown-item">
            <span class="breakdown-dot response"></span>
            <span id="responseCount">0</span> responses
          </div>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-value" id="activeTickets">0</div>
        <div class="summary-label">Active Tickets</div>
      </div>
      <div class="summary-card">
        <div class="summary-value" id="pendingTickets">0</div>
        <div class="summary-label">Pending</div>
      </div>
      <div class="summary-card">
        <div class="summary-value" id="resolvedTickets">0</div>
        <div class="summary-label">Resolved</div>
      </div>
    </div>
    
    <!-- Legend -->
    <div class="legend">
      <div class="legend-item">
        <span class="legend-icon">🔍</span>
        <span>Analysis provided</span>
      </div>
      <div class="legend-item">
        <span class="legend-icon" style="border-color: var(--warning);">💬</span>
        <span>Response drafted</span>
      </div>
      <div class="legend-item">
        <span class="legend-icon" style="border-color: var(--text-secondary);">📝</span>
        <span>Notes/findings</span>
      </div>
    </div>
    
    <!-- Sync Bar -->
    <div class="sync-bar">
      <div class="sync-indicator" id="syncIndicator"></div>
      <span class="sync-text" id="syncText">Loading...</span>
      <div class="sync-actions">
        <button class="btn btn-secondary" onclick="syncFromServer()">↻ Refresh</button>
      </div>
    </div>
    
    <!-- Day Sections -->
    <div id="dayContainer"></div>
  </div>
  
  <script>
    // Data
    let tickets = [];
    let senseiCases = {};
    const CASES_FILE = 'cases.json';
    
    // Zendesk tickets from query (will be merged with cases.json)
    const zendeskTickets = [
      {
        id: 2742849,
        subject: "Poor Audio Quality on Outbound Calls",
        status: "hold",
        priority: "low",
        customer: "Vendor (Georgia calls)",
        category: "voice",
        created_at: "2026-03-11T18:15:46Z",
        updated_at: "2026-03-11T19:27:03Z"
      },
      {
        id: 2742812,
        subject: "Outbound Call Failures",
        status: "hold",
        priority: "low",
        customer: "Vendor (Georgia calls)",
        category: "voice",
        created_at: "2026-03-11T18:08:36Z",
        updated_at: "2026-03-11T20:01:36Z"
      },
      {
        id: 2738674,
        subject: "Audio quality issue - one-way audio and mid-call drop",
        status: "hold",
        priority: "high",
        customer: "CloudTalk",
        category: "voice",
        created_at: "2026-03-10T14:56:27Z",
        updated_at: "2026-03-11T20:01:36Z"
      },
      {
        id: 2737363,
        subject: "Sydney AU Anchorsite routing to EU instead of Australia",
        status: "pending",
        priority: "normal",
        customer: "Axient Pty Ltd",
        category: "voice",
        created_at: "2026-03-09T23:03:22Z",
        updated_at: "2026-03-11T23:23:00Z"
      },
      {
        id: 2735737,
        subject: "Feb 2026 bill question - negative balance clarification",
        status: "pending",
        priority: "normal",
        customer: "Replicant Solutions Inc",
        category: "billing",
        created_at: "2026-03-09T15:12:25Z",
        updated_at: "2026-03-11T20:42:07Z"
      },
      {
        id: 2730532,
        subject: "Post dial delay - 10+ seconds to reach agent",
        status: "pending",
        priority: "high",
        customer: "Callbox / Car Wars",
        category: "voice",
        created_at: "2026-03-05T22:57:19Z",
        updated_at: "2026-03-11T19:38:15Z"
      },
      {
        id: 2727880,
        subject: "Alpha sender not configured (40306 error)",
        status: "pending",
        priority: "urgent",
        customer: "Olin Business School - Washington University",
        category: "messaging",
        created_at: "2026-03-04T22:30:16Z",
        updated_at: "2026-03-10T18:01:35Z"
      },
      {
        id: 2725835,
        subject: "AWS Dubai outage impact investigation",
        status: "pending",
        priority: "high",
        customer: "Trendyol",
        category: "voice",
        created_at: "2026-03-04T11:48:53Z",
        updated_at: "2026-03-11T19:26:34Z"
      },
      {
        id: 2717422,
        subject: "SIM OTA Updates - carrier roaming change request",
        status: "hold",
        priority: "normal",
        customer: "Grain Protein Tech / Automated Production Systems",
        category: "wireless",
        created_at: "2026-02-27T16:35:23Z",
        updated_at: "2026-03-11T23:21:10Z"
      },
      {
        id: 2715340,
        subject: "Two calls bridged together (duplicate call IDs)",
        status: "pending",
        priority: "normal",
        customer: "Audiocodes",
        category: "voice",
        created_at: "2026-02-26T17:04:24Z",
        updated_at: "2026-03-11T19:57:38Z"
      },
      {
        id: 2702425,
        subject: "CA short code 40321 error - no usable numbers",
        status: "pending",
        priority: "high",
        customer: "Iterable",
        category: "messaging",
        created_at: "2026-02-19T22:50:08Z",
        updated_at: "2026-03-11T18:52:12Z"
      },
      {
        id: 2608515,
        subject: "Distorted audio at beginning of inbound calls",
        status: "pending",
        priority: "urgent",
        customer: "inulti",
        category: "voice",
        created_at: "2026-01-12T12:28:17Z",
        updated_at: "2026-03-11T23:22:30Z"
      }
    ];
    
    async function init() {
      await loadCases();
      mergeData();
      render();
    }
    
    async function loadCases() {
      try {
        const res = await fetch(CASES_FILE + '?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          senseiCases = {};
          (data.cases || []).forEach(c => {
            senseiCases[c.ticketId] = c;
          });
        }
      } catch (e) {
        console.log('Cases file not found, using defaults');
      }
    }
    
    function mergeData() {
      tickets = zendeskTickets.map(t => {
        const senseiCase = senseiCases[t.id.toString()];
        return {
          ...t,
          sensei: senseiCase ? {
            analysis: !!senseiCase.findings,
            response: !!senseiCase.response,
            notes: !!senseiCase.notes,
            findings: senseiCase.findings || '',
            draftResponse: senseiCase.response || '',
            internalNotes: senseiCase.notes || '',
            tags: senseiCase.tags || [],
            caseStatus: senseiCase.status
          } : null
        };
      });
    }
    
    async function syncFromServer() {
      const indicator = document.getElementById('syncIndicator');
      const text = document.getElementById('syncText');
      
      indicator.classList.add('syncing');
      text.textContent = 'Syncing...';
      
      await loadCases();
      mergeData();
      render();
      
      indicator.classList.remove('syncing');
      text.textContent = 'Last synced: ' + new Date().toLocaleTimeString();
    }
    
    function groupByDay(tickets) {
      const groups = {};
      tickets.forEach(t => {
        const date = t.updated_at.split('T')[0];
        if (!groups[date]) groups[date] = [];
        groups[date].push(t);
      });
      return groups;
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      
      if (dateStr === today.toISOString().split('T')[0]) {
        return 'Today';
      } else if (dateStr === yesterday.toISOString().split('T')[0]) {
        return 'Yesterday';
      }
      
      return date.toLocaleDateString('en-US', { 
        weekday: 'long', 
        month: 'short', 
        day: 'numeric' 
      });
    }
    
    function getCategoryClass(category) {
      const map = {
        voice: 'category-voice',
        messaging: 'category-messaging',
        billing: 'category-billing',
        wireless: 'category-wireless'
      };
      return map[category] || '';
    }
    
    function render() {
      // Update summary
      const assisted = tickets.filter(t => t.sensei);
      const analysisCount = tickets.filter(t => t.sensei?.analysis).length;
      const responseCount = tickets.filter(t => t.sensei?.response).length;
      const resolved = tickets.filter(t => t.sensei?.caseStatus === 'resolved').length;
      const pending = tickets.filter(t => t.status === 'pending' || t.status === 'hold').length;
      
      document.getElementById('totalAssisted').textContent = assisted.length;
      document.getElementById('analysisCount').textContent = analysisCount;
      document.getElementById('responseCount').textContent = responseCount;
      document.getElementById('activeTickets').textContent = tickets.length;
      document.getElementById('pendingTickets').textContent = pending;
      document.getElementById('resolvedTickets').textContent = resolved;
      
      // Group by day
      const byDay = groupByDay(tickets);
      const sortedDays = Object.keys(byDay).sort((a, b) => b.localeCompare(a));
      
      const container = document.getElementById('dayContainer');
      container.innerHTML = sortedDays.map(day => {
        const dayTickets = byDay[day];
        const dayAssisted = dayTickets.filter(t => t.sensei).length;
        const dayResponses = dayTickets.filter(t => t.sensei?.response).length;
        
        return `
          <div class="day-section">
            <div class="day-header">
              <div class="day-date">${formatDate(day)}</div>
              <div class="day-stats">
                <div class="day-stat">
                  <span class="day-stat-value">${dayTickets.length}</span> tickets
                </div>
                <div class="day-stat">
                  <span class="day-stat-value">${dayAssisted}</span> assisted
                </div>
                <div class="day-stat">
                  <span class="day-stat-value">${dayResponses}</span> responses
                </div>
              </div>
            </div>
            <div class="tickets-list">
              ${dayTickets.map(t => renderTicket(t)).join('')}
            </div>
          </div>
        `;
      }).join('');
      
      document.getElementById('syncText').textContent = 'Last synced: ' + new Date().toLocaleTimeString();
    }
    
    function renderTicket(t) {
      const hasAnalysis = t.sensei?.analysis;
      const hasResponse = t.sensei?.response;
      const hasNotes = t.sensei?.notes;
      const isAssisted = t.sensei;
      
      return `
        <div class="ticket-card ${isAssisted ? 'sensei-assisted' : ''}" id="ticket-${t.id}">
          <div class="ticket-id-col">
            <span class="ticket-id">
              <a href="https://telnyx.zendesk.com/agent/tickets/${t.id}" target="_blank">#${t.id}</a>
            </span>
            <span class="ticket-status status-${t.status}">${t.status}</span>
          </div>
          
          <div class="ticket-content">
            <div class="ticket-title">${escapeHtml(t.subject)}</div>
            <div class="ticket-meta">
              <span class="ticket-customer">${escapeHtml(t.customer)}</span>
              ${t.priority === 'urgent' ? ' · <span style="color: var(--danger);">⚡ Urgent</span>' : ''}
              ${t.priority === 'high' ? ' · <span style="color: var(--warning);">High</span>' : ''}
            </div>
            <div class="ticket-tags">
              <span class="ticket-tag ${getCategoryClass(t.category)}">${t.category}</span>
              ${(t.sensei?.tags || []).slice(0, 3).map(tag => 
                `<span class="ticket-tag">${escapeHtml(tag)}</span>`
              ).join('')}
            </div>
          </div>
          
          <div class="ticket-actions">
            <div class="sensei-badges">
              <span class="sensei-badge analysis ${hasAnalysis ? 'active' : ''}" title="Analysis provided">🔍</span>
              <span class="sensei-badge response ${hasResponse ? 'active' : ''}" title="Response drafted">💬</span>
              <span class="sensei-badge notes ${hasNotes ? 'active' : ''}" title="Notes/findings">📝</span>
            </div>
            ${isAssisted ? `<button class="expand-btn" onclick="toggleExpand(${t.id})">Details</button>` : ''}
          </div>
          
          ${isAssisted ? `
            <div class="sensei-details">
              ${t.sensei.findings ? `
                <div class="sensei-section">
                  <div class="sensei-section-title">🔍 Analysis / Root Cause</div>
                  <div class="sensei-section-content">${escapeHtml(t.sensei.findings)}</div>
                </div>
              ` : ''}
              ${t.sensei.draftResponse ? `
                <div class="sensei-section">
                  <div class="sensei-section-title">💬 Draft Response</div>
                  <div class="sensei-section-content">${escapeHtml(t.sensei.draftResponse)}</div>
                </div>
              ` : ''}
              ${t.sensei.internalNotes ? `
                <div class="sensei-section">
                  <div class="sensei-section-title">📝 Internal Notes</div>
                  <div class="sensei-section-content">${escapeHtml(t.sensei.internalNotes)}</div>
                </div>
              ` : ''}
            </div>
          ` : ''}
        </div>
      `;
    }
    
    function toggleExpand(id) {
      const card = document.getElementById('ticket-' + id);
      card.classList.toggle('expanded');
      const btn = card.querySelector('.expand-btn');
      btn.textContent = card.classList.contains('expanded') ? 'Collapse' : 'Details';
    }
    
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    
    init();
  </script>
</body>
</html>
